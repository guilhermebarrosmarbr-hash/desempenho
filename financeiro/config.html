<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações Supabase — BPO Financeiro</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .config-container {
            max-width: 650px;
            margin: 40px auto;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 32px;
            backdrop-filter: blur(10px);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }
        .btn-save:hover {
            background: #1d4ed8;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status-badge.connected {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .nav-back:hover {
            color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="config-container">
        <a href="../index.html" class="nav-back">← Voltar ao Início</a>
        
        <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;">Conexão com o Supabase</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">
            Insira os dados do seu projeto Supabase para habilitar a persistência em nuvem dos módulos 04 a 08.
        </p>

        <div id="statusIndicator" class="status-badge disconnected">
            ● Desconectado
        </div>

        <form id="formSupabase">
            <div class="form-group">
                <label for="supabaseUrl">Project URL</label>
                <input type="url" id="supabaseUrl" placeholder="https://seu-projeto.supabase.co" required>
            </div>

            <div class="form-group">
                <label for="supabaseAnonKey">Project API Key (anon / public)</label>
                <input type="text" id="supabaseAnonKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." required>
            </div>

            <button type="submit" class="btn-save" id="btnSalvar">Salvar e Testar Conexão</button>
        </form>

        <div id="feedbackMsg" style="margin-top: 16px; font-size: 0.9rem; display: none;"></div>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        const form = document.getElementById('formSupabase');
        const urlInput = document.getElementById('supabaseUrl');
        const anonInput = document.getElementById('supabaseAnonKey');
        const statusIndicator = document.getElementById('statusIndicator');
        const feedbackMsg = document.getElementById('feedbackMsg');

        // Carregar configurações existentes
        if (window.BpoSupabase.isConfigured()) {
            urlInput.value = window.BpoSupabase.url;
            anonInput.value = window.BpoSupabase.anonKey;
            statusIndicator.className = 'status-badge connected';
            statusIndicator.innerHTML = '● Conectado ao Supabase';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedbackMsg.style.display = 'block';
            feedbackMsg.style.color = '#38bdf8';
            feedbackMsg.innerText = 'Testando conexão...';

            const url = urlInput.value.trim();
            const anon = anonInput.value.trim();

            window.BpoSupabase.saveConfig(url, anon);

            try {
                // Tenta consultar grupos ou verificar saúde
                await window.BpoSupabase.request('groups?limit=1', { method: 'GET' });
                statusIndicator.className = 'status-badge connected';
                statusIndicator.innerHTML = '● Conexão bem-sucedida!';
                feedbackMsg.style.color = '#4ade80';
                feedbackMsg.innerText = 'Conectado com sucesso ao Supabase! As tabelas estão prontas para uso.';
            } catch (err) {
                // Se der erro 404 de tabela inexistente, significa que conectou na URL mas a tabela ainda não foi criada via SQL
                if (err.message.includes('404') || err.message.includes('relation "groups" does not exist') || err.message.includes('PGRST204')) {
                    statusIndicator.className = 'status-badge connected';
                    statusIndicator.innerHTML = '● Conectado (Aguardando Migrações)';
                    feedbackMsg.style.color = '#fbbf24';
                    feedbackMsg.innerText = 'Conectou ao Supabase com sucesso! Execute o script 001_base_schema.sql no SQL Editor do Supabase.';
                } else {
                    statusIndicator.className = 'status-badge disconnected';
                    statusIndicator.innerHTML = '● Erro de Conexão';
                    feedbackMsg.style.color = '#f87171';
                    feedbackMsg.innerText = 'Falha ao conectar: ' + err.message;
                }
            }
        });
    </script>
</body>
</html>
